<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cours 12</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="assets/css/styles.css" />
        <script src="assets/js/main.js" defer></script>
    </head>
    <body>
        <header>
            <nav id="nav-principale">
                <img src="assets/img/logo_vinyle.png" alt="logo" class="logo" />
                <ul class="nav__liste">
                    <li>
                        <a href="#" style="color: tomato; text-decoration: underline">Accueil</a>
                    </li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="#">À propos</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <form action="" method="get" id="formulaire-principal">
                <div class="groupe-champs recherche-villes">
                    <input type="search" name="input-villes" />
                    <ul class="liste-villes">
                        <li>Paris</li>
                        <li>Lyon</li>
                        <li>Marseille</li>
                        <li>Nantes</li>
                        <li>Lille</li>
                    </ul>
                </div>
            </form>
            <button class="fullscreen-btn">Plein écran</button>
            <p class="fullscreen-message invisible">Pour quitter le mode plein écran, appuyez sur la touche q</p>
        </main>
    </body>
</html>
